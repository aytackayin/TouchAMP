<VirtualHost *:80>
  ServerName localhost
  ServerAlias 127.0.0.1 ::1
  DocumentRoot "H:/Projeler/TouchAMP/www"
  <Directory "H:/Projeler/TouchAMP/www">
    AllowOverride All
    Require all granted
    Options Indexes FollowSymLinks
  </Directory>
</VirtualHost>
<VirtualHost *:443>
  ServerName localhost
  ServerAlias 127.0.0.1 ::1
  DocumentRoot "H:/Projeler/TouchAMP/www"
  SSLEngine on
  SSLCertificateFile "H:/Projeler/TouchAMP/etc/ssl/localhost.crt"
  SSLCertificateKeyFile "H:/Projeler/TouchAMP/etc/ssl/localhost.key"
  <Directory "H:/Projeler/TouchAMP/www">
    AllowOverride All
    Require all granted
    Options Indexes FollowSymLinks
  </Directory>
</VirtualHost>
